<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bound Studios — Enquiry Manager</title>

  <!-- Preconnect to Google Fonts for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet">

  <!-- Theme Flash Prevention: Evaluates localStorage and system preferences before React mounts -->
  <script>
    (function () {
      try {
        var localTheme = localStorage.getItem('bound-theme');
        var sysTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

        // Apply dark class immediately to prevent unstyled flash before React hydration
        if (localTheme === 'dark' || ((!localTheme || localTheme === 'system') && sysTheme)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
